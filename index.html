<!DOCTYPE html>
<html lang="fr" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>VTC Pro - LE BON FRÈRE VTC</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: { extend: { colors: { vtc: {
                900: '#0f172a', 800: '#1e293b', 700: '#334155',
                brand: '#10b981', accent: '#3b82f6', uber: '#000000', bolt: '#34d399', heetch: '#f43f5e'
            } } } }
        }
    </script>
    <style>
        ::-webkit-scrollbar { width: 0px; background: transparent; }
        body { -webkit-tap-highlight-color: transparent; background-color: #0f172a; }
        .tab-content { display: none; }
        .tab-content.active { display: block; }
        input[type="number"] { -moz-appearance: textfield; }
        input[type="number"]::-webkit-outer-spin-button,
        input[type="number"]::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
        .whitespace-pre-wrap { white-space: pre-wrap; }
        .pac-container { z-index: 9999 !important; }
        .offer-card.selected { border-color: #3b82f6; background: rgba(30,58,138,0.25); }

        @media print {
            body * { visibility: hidden !important; }
            #printable-bon, #printable-bon * { visibility: visible !important; }
            #printable-bon {
                position: fixed !important; left: 0 !important; top: 0 !important;
                width: 100% !important; height: auto !important; margin: 0 !important;
                padding: 25px !important; background: white !important; color: black !important;
            }
            .no-print { display: none !important; }
        }
    </style>
</head>
<body class="bg-vtc-900 text-white font-sans h-screen flex flex-col overflow-hidden">

    <!-- Header -->
    <header class="bg-vtc-800 px-4 py-3 flex justify-between items-center shadow-md z-10 border-b border-vtc-700/50">
        <div class="flex flex-col">
            <span class="text-[11px] font-bold text-slate-400 uppercase tracking-wider">LE BON FRÈRE VTC • Jour J (04h → 04h)</span>
            <div class="flex items-baseline gap-1">
                <span id="header-total" class="text-2xl sm:text-3xl font-extrabold text-vtc-brand">0.00</span>
                <span class="text-base text-vtc-brand font-bold">€</span>
            </div>
            <span class="text-[10px] text-slate-500 font-medium">Semaine : <span id="header-week-total">0.00</span> €</span>
        </div>
        <button onclick="confirmResetDay()" class="bg-vtc-900 hover:bg-red-950/40 border border-vtc-700 hover:border-red-500/50 text-slate-300 hover:text-red-400 px-3 py-1.5 rounded-xl text-xs font-semibold flex items-center gap-1.5 transition">
            <i data-lucide="rotate-ccw" class="w-3.5 h-3.5"></i> Reset jour
        </button>
    </header>

    <main class="flex-1 overflow-y-auto pb-24 relative">

        <!-- Toast -->
        <div id="toast" class="fixed top-16 left-1/2 transform -translate-x-1/2 bg-vtc-accent text-white px-5 py-2.5 rounded-full shadow-2xl text-xs font-bold transition-opacity duration-300 opacity-0 pointer-events-none z-50 flex items-center gap-2 border border-blue-400/30">
            <i data-lucide="check-circle-2" class="w-4 h-4"></i>
            <span id="toast-msg">Action effectuée</span>
        </div>

        <!-- TAB 1: CAISSE -->
        <div id="tab-caisse" class="tab-content active p-4 space-y-5">

            <div class="bg-vtc-800 rounded-2xl p-5 shadow-lg border border-vtc-700/50 flex flex-col items-center">
                <label class="text-xs text-slate-400 font-medium mb-2">Saisir une course (€)</label>
                <input type="number" id="input-amount" placeholder="0.00" inputmode="decimal" step="0.01" class="w-full bg-vtc-900 border-2 border-vtc-700 rounded-xl p-3.5 text-center text-3xl font-extrabold text-white focus:outline-none focus:border-vtc-brand transition mb-3">

                <div class="grid grid-cols-4 gap-2 w-full mb-4">
                    <button type="button" onclick="selectChannel('Uber')" id="btn-chan-Uber" class="chan-btn py-2 rounded-xl border border-slate-700 text-xs font-bold text-slate-300 bg-vtc-900 transition">Uber</button>
                    <button type="button" onclick="selectChannel('Bolt')" id="btn-chan-Bolt" class="chan-btn py-2 rounded-xl border border-slate-700 text-xs font-bold text-slate-300 bg-vtc-900 transition">Bolt</button>
                    <button type="button" onclick="selectChannel('Heetch')" id="btn-chan-Heetch" class="chan-btn py-2 rounded-xl border border-slate-700 text-xs font-bold text-slate-300 bg-vtc-900 transition">Heetch</button>
                    <button type="button" onclick="selectChannel('Prive')" id="btn-chan-Prive" class="chan-btn py-2 rounded-xl border border-slate-700 text-xs font-bold text-slate-300 bg-vtc-900 transition">Privé</button>
                </div>

                <button onclick="addEarning()" class="w-full bg-vtc-brand hover:bg-emerald-600 text-slate-950 font-bold text-base py-3.5 rounded-xl shadow-lg transition active:scale-95 flex items-center justify-center gap-2">
                    <i data-lucide="plus-circle" class="w-5 h-5"></i> Encaisser la course
                </button>
            </div>

            <!-- Graphique hebdomadaire par journée 04h-04h -->
            <div class="bg-vtc-800 rounded-2xl p-4 shadow-lg border border-vtc-700/50">
                <div class="flex justify-between items-center mb-3">
                    <h3 class="text-xs font-bold text-slate-400 uppercase tracking-wider">Suivi par journée</h3>
                    <span class="text-[10px] text-emerald-400 font-semibold bg-emerald-950/60 border border-emerald-800/50 px-2 py-0.5 rounded-full">Journée : 04h00 → 04h00</span>
                </div>
                <div id="weekly-chart-container" class="w-full h-36 flex items-end justify-between gap-1 pt-4 pb-1 px-1"></div>
            </div>

            <!-- Liste du jour J -->
            <div>
                <div class="flex justify-between items-center mb-2 px-1">
                    <h3 class="text-xs font-bold text-slate-400 uppercase tracking-wider">Courses du jour J <span id="day-label" class="normal-case text-slate-500"></span></h3>
                    <span id="count-courses" class="text-xs text-slate-500 font-medium">0 course</span>
                </div>
                <div id="earnings-list" class="space-y-2"></div>
            </div>
        </div>

        <!-- TAB 2: DEVIS PRIVÉ -->
        <div id="tab-devis" class="tab-content p-4 space-y-5">
            <div class="bg-vtc-800 rounded-2xl p-5 shadow-lg border border-vtc-700/50 space-y-3.5">
                <h2 class="text-base font-bold text-white mb-2 flex items-center gap-2">
                    <i data-lucide="calculator" class="text-vtc-accent"></i> Devis Privé
                </h2>

                <div class="space-y-1">
                    <label class="text-[11px] text-slate-400 font-medium">Lieu de prise en charge</label>
                    <input type="text" id="devis-from" placeholder="Ex: Asnières-sur-Seine" class="w-full bg-vtc-900 border border-vtc-700 rounded-xl p-3 text-xs sm:text-sm text-white focus:outline-none focus:border-vtc-accent">
                </div>

                <div class="space-y-1">
                    <label class="text-[11px] text-slate-400 font-medium">Destination</label>
                    <input type="text" id="devis-to" placeholder="Ex: Aéroport CDG Terminal 2E" class="w-full bg-vtc-900 border border-vtc-700 rounded-xl p-3 text-xs sm:text-sm text-white focus:outline-none focus:border-vtc-accent">
                </div>

                <div class="grid grid-cols-2 gap-3">
                    <div class="space-y-1">
                        <label class="text-[11px] text-slate-400 font-medium">Date de départ</label>
                        <input type="date" id="devis-date" class="w-full bg-vtc-900 border border-vtc-700 rounded-xl p-3 text-xs text-white" style="color-scheme: dark;">
                    </div>
                    <div class="space-y-1">
                        <label class="text-[11px] text-slate-400 font-medium">Heure de départ</label>
                        <input type="time" id="devis-time" class="w-full bg-vtc-900 border border-vtc-700 rounded-xl p-3 text-xs text-white" style="color-scheme: dark;">
                    </div>
                </div>

                <div class="space-y-1">
                    <label class="text-[11px] text-slate-400 font-medium">Affluence / demande</label>
                    <select id="devis-affluence" class="w-full bg-vtc-900 border border-vtc-700 rounded-xl p-3 text-xs sm:text-sm text-white focus:outline-none focus:border-vtc-accent">
                        <option value="auto" selected>Auto (selon jour et heure)</option>
                        <option value="faible">Faible (×0.95)</option>
                        <option value="normale">Normale (×1.00)</option>
                        <option value="forte">Forte (×1.15)</option>
                        <option value="tres_forte">Très forte (×1.30)</option>
                    </select>
                </div>

                <div class="space-y-1.5">
                    <div class="flex justify-between items-center">
                        <label class="text-[11px] text-slate-400 font-medium">Coefficient multiplicateur</label>
                        <span id="coef-label" class="text-sm font-extrabold text-vtc-accent">×1.00</span>
                    </div>
                    <input type="range" id="devis-coef" min="0.5" max="3" step="0.05" value="1" class="w-full accent-blue-500" oninput="updateCoefLabel()">
                    <div class="grid grid-cols-5 gap-1.5">
                        <button type="button" onclick="setCoef(1)" class="py-1.5 rounded-lg bg-vtc-900 border border-vtc-700 text-[11px] font-bold text-slate-300">×1</button>
                        <button type="button" onclick="setCoef(1.2)" class=
